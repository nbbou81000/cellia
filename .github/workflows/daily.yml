name: CelliA — Veille quotidienne

on:
  schedule:
    - cron: '0 4 * * *'    # 6h Paris
    - cron: '0 7 * * *'    # 9h Paris
    - cron: '0 10 * * *'   # 12h Paris
    - cron: '0 12 * * *'   # 14h Paris
    - cron: '0 14 * * *'   # 16h Paris
    - cron: '0 18 * * *'   # 20h Paris
  workflow_dispatch:
    inputs:
      dev_mode:
        description: 'Mode dev (3 articles seulement)'
        required: false
        default: 'false'
        type: boolean
      paid_mode:
        description: 'Mode payant — Gemini 2.5 Flash (clé facturée niveau 1)'
        required: false
        default: 'false'
        type: boolean
      korben_mode:
        description: 'Spécial Korben — tous les articles du jour de korben.info'
        required: false
        default: 'false'
        type: boolean
      fond_mode:
        description: 'Article de fond — sélection + réécriture longue forme (API payante requise)'
        required: false
        default: 'false'
        type: boolean
      mistral_boost:
        description: 'CRON Mistral Boost — mistral-small-2506 JSON 8000 tok · 20 articles'
        required: false
        default: 'false'
        type: boolean

jobs:
  fetch-and-deploy:
    name: Fetch RSS → Mistral → GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Détecter le mode et enregistrer l'heure de démarrage ──────────────
      - name: Init statut
        id: init
        run: |
          START=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "started_at=$START" >> $GITHUB_OUTPUT

          # Détecter le mode actif
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="Scheduled Mistral"
          elif [ "${{ github.event.inputs.mistral_boost }}" = "true" ]; then
            MODE="Mistral Boost"
          elif [ "${{ github.event.inputs.paid_mode }}" = "true" ]; then
            MODE="Mode Payant"
          elif [ "${{ github.event.inputs.korben_mode }}" = "true" ]; then
            MODE="Spécial Korben"
          elif [ "${{ github.event.inputs.fond_mode }}" = "true" ]; then
            MODE="Article de Fond"
          elif [ "${{ github.event.inputs.dev_mode }}" = "true" ]; then
            MODE="Dev"
          else
            MODE="Standard"
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT

          # Écrire statut "running" sur GitHub Pages
          git config user.name  "CelliA Bot"
          git config user.email "cellia-bot@noreply.github.com"
          cat > workflow-status.json << JSON
          {
            "status": "running",
            "mode": "$MODE",
            "started_at": "$START",
            "finished_at": null,
            "articles": null,
            "duration_min": null
          }
          JSON
          git add workflow-status.json
          git commit -m "status: 🔄 running — $MODE"
          git push

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Fetch & rewrite
        working-directory: scripts
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY:     ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          USE_PAID_GEMINI:     ${{ github.event.inputs.paid_mode }}
          USE_KORBEN:          ${{ github.event.inputs.korben_mode }}
          USE_FOND:            ${{ github.event.inputs.fond_mode }}
          USE_MISTRAL_BOOST:   ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.mistral_boost }}
          IS_SCHEDULED:        ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: |
          if [ "${{ github.event.inputs.dev_mode }}" = "true" ]; then
            node fetch.js --dev
          else
            node fetch.js
          fi

      - name: Generate share preview pages
        run: node gen-og.js

      - name: Verify
        run: |
          if [ ! -f dist/articles.json ] || [ ! -f dist/articles-full.json ]; then exit 1; fi
          COUNT=$(node -e "console.log(require('./dist/articles.json').count)")
          echo "✓ $COUNT articles"

      - name: Commit articles
        run: |
          git add dist/articles.json dist/articles-full.json
          git add dist/articles-fond.json 2>/dev/null || true
          git add dist/articles/ 2>/dev/null || true
          git add dist/a/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Rien à commiter"
          else
            git commit -m "chore: articles $(date -u '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Notification push
        if: success()
        run: |
          COUNT=$(node -e "console.log(require('./dist/articles.json').count)" 2>/dev/null || echo "?")
          curl -s \
            -H "Title: CelliA — Veille tech" \
            -H "Priority: default" \
            -H "Tags: newspaper" \
            -d "✅ $COUNT articles disponibles" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true

      # ── Écrire le statut final (toujours exécuté) ─────────────────────────
      - name: Écriture statut final
        if: always()
        run: |
          END=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          START="${{ steps.init.outputs.started_at }}"
          MODE="${{ steps.init.outputs.mode }}"
          JOB_STATUS="${{ job.status }}"
          COUNT=$(node -e "console.log(require('./dist/articles.json').count)" 2>/dev/null || echo "0")

          # Calculer la durée en minutes
          START_S=$(date -d "$START" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$START" +%s 2>/dev/null || echo "0")
          END_S=$(date +%s)
          DURATION=$(( (END_S - START_S) / 60 ))

          # Emoji selon statut
          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="✅"
          else
            EMOJI="❌"
          fi

          cat > workflow-status.json << JSON
          {
            "status": "$JOB_STATUS",
            "emoji": "$EMOJI",
            "mode": "$MODE",
            "started_at": "$START",
            "finished_at": "$END",
            "articles": $COUNT,
            "duration_min": $DURATION
          }
          JSON

          git add workflow-status.json
          git commit -m "status: $EMOJI $JOB_STATUS — $COUNT articles — $MODE"
          git push

      - name: Summary
        if: always()
        run: |
          echo "## CelliA" >> $GITHUB_STEP_SUMMARY
          if [ -f dist/articles.json ]; then
            COUNT=$(node -e "console.log(require('./dist/articles.json').count)")
            DATE=$(node -e "console.log(require('./dist/articles.json').generated_at)")
            echo "✅ **$COUNT articles** — \`$DATE\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Échec" >> $GITHUB_STEP_SUMMARY
          fi
